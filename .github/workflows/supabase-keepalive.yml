name: Supabase keepalive

# The free-tier database pauses itself after about a week without
# traffic, which takes the whole app down (login says "check the
# connection"). This daily ping counts as real database activity, so
# quiet stretches — holidays, vacations — never trigger the pause.
#
# The key below is the publishable anon key; it already ships inside the
# app's client bundle, so it is not a secret.

on:
  schedule:
    - cron: "37 21 * * *" # daily, 5:37 AM Manila
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through PostgREST
        # Tables are locked to signed-in users (anon grants were revoked in
        # hardening), so the ping calls business_date() — a harmless
        # function anon may still execute, and a real database round-trip.
        run: |
          body=$(curl -s -w "\n%{http_code}" -X POST \
            "https://sbvlwfwmasbealmhwzyl.supabase.co/rest/v1/rpc/business_date" \
            -H "apikey: sb_publishable_oLa8nOAMiXagjAq5FwqtWg_iim1wy31" \
            -H "Content-Type: application/json" -d '{}')
          echo "$body"
          test "$(echo "$body" | tail -1)" = "200"
